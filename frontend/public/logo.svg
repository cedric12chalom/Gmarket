<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Leaf: solid silhouette for legibility at small (favicon) sizes -->
  <path
    d="M52 90
       C24 86 14 58 26 32
       C36 12 54 6 70 12
       C80 16 84 26 80 38
       C72 62 58 78 52 90
       Z"
    fill="#4a6b33"
  />
  <!-- Center vein, doubling as the stem leading down to the link node -->
  <path
    d="M68 14 C50 34 40 58 32 82"
    fill="none" stroke="#f4f7f0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"
  />
  <!-- Link: two connected nodes, the "Link" in TerraLink -->
  <path d="M32 82 C29 87 24 90 18 91" fill="none" stroke="#4a6b33" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="18" cy="91" r="6.5" fill="#c9622a" />
  <path d="M24 90 L36 88" stroke="#c9622a" stroke-width="3" stroke-linecap="round" />
  <circle cx="40" cy="87" r="4" fill="#e07f47" />
</svg>
